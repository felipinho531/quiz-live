<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Live</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #030510;
    color: white;
}

.live {
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
    background: radial-gradient(ellipse at top, #253477, #080b20 60%);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.badge {
    background: #ff1744;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { opacity: .65; }
}

.logo {
    text-align: center;
    font-size: 48px;
    font-weight: 900;
    margin: 25px 0 5px;
    color: #00eaff;
    text-shadow: 0 0 25px #00aaff;
}

.subtitle {
    text-align: center;
    color: #b2c3ff;
    margin-bottom: 25px;
}

.category {
    text-align: center;
    color: #ffdd44;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 10px;
}

.timer {
    width: 125px;
    height: 125px;
    margin: 15px auto;
    display: grid;
    place-items: center;
    border: 7px solid #00eaff;
    border-radius: 50%;
    font-size: 52px;
    font-weight: 900;
    box-shadow: 0 0 30px #00eaff55;
}

.progress {
    height: 10px;
    background: #ffffff22;
    border-radius: 20px;
    overflow: hidden;
}

#bar {
    height: 100%;
    width: 100%;
    background: #00eaff;
    transition: width .4s;
}

.question {
    min-height: 170px;
    display: grid;
    place-items: center;
    text-align: center;
    background: #ffffff0c;
    border: 2px solid #5769aa;
    border-radius: 24px;
    padding: 20px;
    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
}

.instruction {
    text-align: center;
    color: #b8ccff;
    padding: 15px;
}

.feedback {
    min-height: 60px;
    text-align: center;
    color: #56ff99;
    font-size: 23px;
    font-weight: bold;
    padding: 10px;
}

.rankings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.ranking {
    background: #ffffff0a;
    border: 1px solid #ffffff22;
    border-radius: 18px;
    padding: 12px;
    min-height: 240px;
}

.ranking h2 {
    text-align: center;
    font-size: 16px;
    color: #ffdd44;
}

.player {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    padding: 10px 0;
    border-bottom: 1px solid #ffffff18;
    font-size: 13px;
}

.player span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.empty {
    color: #aab5d5;
    text-align: center;
    font-size: 13px;
}

.gift {
    display: none;
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: min(90%, 400px);
    background: linear-gradient(135deg, #8624dd, #ec238c);
    border: 3px solid #ffdc70;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    z-index: 10;
    box-shadow: 0 0 50px #ff49c8;
    overflow-wrap: anywhere;
}

.gift.show {
    display: block;
    animation: giftAnimation .5s ease;
}

@keyframes giftAnimation {
    from { opacity: 0; scale: .6; }
    to { opacity: 1; scale: 1; }
}

button, input {
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
}

button {
    cursor: pointer;
    font-weight: bold;
    background: #00eaff;
    color: #051222;
}

#start {
    display: block;
    width: 100%;
    margin: 20px auto;
    padding: 18px;
}

#testPanel {
    display: none;
    background: #19213a;
    padding: 18px;
    margin-top: 20px;
    border-radius: 15px;
}

#testPanel input,
#testPanel button {
    display: block;
    width: 100%;
    margin-bottom: 10px;
}

#testPanel input {
    background: #303b60;
    color: white;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #8999c2;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="live">

    <div class="header">
        <span class="badge">● DEMONSTRAÇÃO</span>
        <span id="round">RODADA 0</span>
    </div>

    <div class="logo">QUIZ LIVE</div>
    <div class="subtitle" id="subtitle">Você consegue acertar?</div>

    <div class="category" id="category">
        DESAFIO DE CONHECIMENTOS
    </div>

    <div class="timer" id="timer">30</div>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <div class="question" id="question">
        Preparados para o desafio?
    </div>

    <div class="instruction">
        💬 Responda pelo chat!
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="rankings">

        <div class="ranking">
            <h2>🧠 TOP 5 QUIZ</h2>
            <div id="quizRanking" class="empty">
                Aguardando jogadores
            </div>
        </div>

        <div class="ranking">
            <h2>🎁 TOP APOIADORES</h2>
            <div id="giftRanking" class="empty">
                Aguardando presentes
            </div>
        </div>

    </div>

    <button id="start" onclick="startGame()">
        ▶ INICIAR QUIZ
    </button>

    <div class="footer" id="totalQuestions">
        Carregando perguntas...
    </div>

    <div id="testPanel">
        <h3>Painel de testes</h3>

        <input id="testName" placeholder="Nome">
        <input id="testAnswer" placeholder="Resposta">

        <button onclick="simulateAnswer()">
            Simular comentário
        </button>

        <input id="testGift" placeholder="Presente">

        <input id="testValue" type="number"
               min="1" value="1">

        <button onclick="simulateGift()">
            Simular presente
        </button>

        <button onclick="toggleMusic()">
            Ligar / desligar música
        </button>
    </div>

</div>

<div class="gift" id="giftAlert"></div>

<script src="perguntas.js"></script>

<script>

const questions = typeof bancoPerguntas !== "undefined"
    ? bancoPerguntas
    : [];

const quizScores = new Map();
const giftScores = new Map();
const answered = new Set();

let deck = [];
let current;
let lastQuestion;
let time = 30;
let round = 0;
let active = false;
let started = false;
let interval;
let deadline;
let audio;
let musicEnabled = true;
let musicTimer;
let musicGain;
let musicIndex = 0;
let giftTimer;

const $ = id => document.getElementById(id);

$("totalQuestions").textContent =
    questions.length.toLocaleString("pt-BR") +
    " PERGUNTAS DISPONÍVEIS";

function normalize(text) {
    return String(text)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[.!?]+$/g, "")
        .replace(/\s+/g, " ");
}

function speak(text, urgent = false) {

    if (!("speechSynthesis" in window)) return;

    const voice = new SpeechSynthesisUtterance(text);

    const voices = speechSynthesis.getVoices();

    const selected = voices.find(v =>
        /^pt[-_]BR$/i.test(v.lang) &&
        /Antonio|Antônio|Daniel|Felipe|Male/i.test(v.name)
    );

    voice.lang = "pt-BR";
    voice.rate = urgent ? 1.17 : 1.08;
    voice.pitch = 1.02;
    voice.volume = 1;

    if (selected) voice.voice = selected;

    if (urgent) speechSynthesis.cancel();

    voice.onstart = () => {
        if (musicGain) musicGain.gain.value = 0.025;
    };

    voice.onend = voice.onerror = () => {
        if (musicGain) musicGain.gain.value = 0.065;
    };

    speechSynthesis.speak(voice);
}

function initAudio() {

    if (!audio) {

        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        audio = new AudioContextClass();

        musicGain = audio.createGain();

        musicGain.gain.value = 0.065;

        musicGain.connect(audio.destination);
    }

    audio.resume().catch(() => {});
}

function tone(frequency, duration, volume, target, delay = 0) {

    if (!audio || !target) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    const start = audio.currentTime + delay;

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(0.001, start);

    gain.gain.exponentialRampToValueAtTime(
        volume, start + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001, start + duration
    );

    oscillator.connect(gain);
    gain.connect(target);

    oscillator.start(start);
    oscillator.stop(start + duration);
}

function effect(type) {

    if (!audio) return;

    const notes = type === "gift"
        ? [523,659,784,1047]
        : type === "correct"
        ? [660,880,1047]
        : [440];

    notes.forEach((note,index) => {
        tone(note,0.20,0.11,
            audio.destination,index * 0.09);
    });
}

function startMusic() {

    if (!audio || musicTimer || !musicEnabled) return;

    const notes = [
        261.63,329.63,392,329.63,
        220,261.63,329.63,261.63,
        174.61,220,261.63,220,
        196,246.94,293.66,246.94
    ];

    musicTimer = setInterval(() => {

        const index = musicIndex++ % notes.length;

        tone(notes[index],0.22,0.65,musicGain);

        if (index % 4 === 0) {
            tone(notes[index]/2,0.55,0.5,musicGain);
        }

    },280);
}

function toggleMusic() {

    musicEnabled = !musicEnabled;

    if (musicEnabled) {
        initAudio();
        startMusic();
    } else {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

function startGame() {

    if (started) return;

    if (!questions.length) {
        $("question").textContent =
            "Erro ao carregar perguntas.js";
        return;
    }

    started = true;

    initAudio();
    startMusic();

    $("start").style.display = "none";

    nextQuestion();
}

function refillDeck() {

    deck = [...questions];

    for (let i = deck.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [deck[i],deck[j]] = [deck[j],deck[i]];
    }

    if (
        deck.length > 1 &&
        deck[deck.length - 1][1] === lastQuestion
    ) {
        [deck[0],deck[deck.length - 1]] =
        [deck[deck.length - 1],deck[0]];
    }
}

function nextQuestion() {

    if (!deck.length) refillDeck();

    current = deck.pop();

    lastQuestion = current[1];

    round++;

    answered.clear();

    time = 30;
    active = true;
    deadline = Date.now() + 30000;

    $("round").textContent = "RODADA " + round;

    $("category").textContent = current[0];

    $("question").textContent = current[1];

    $("feedback").textContent = "";

    updateTimer();

    const intros = [
        "Valendo!",
        "Bora para mais uma!",
        "Atenção, galera!",
        "Será que você sabe?",
        "Preparados? Lá vai!"
    ];

    const intro = intros[
        Math.floor(Math.random() * intros.length)
    ];

    speak(intro + " " + current[1],true);

    clearInterval(interval);

    interval = setInterval(() => {

        const remaining = Math.max(
            0,Math.ceil((deadline-Date.now())/1000)
        );

        if (remaining === time) return;

        time = remaining;

        updateTimer();

        if (time === 5) {
            speak("Últimos cinco segundos!",true);
        }

        if (time > 0 && time <= 5) {
            effect("tick");
        }

        if (time === 0) endQuestion();

    },100);
}

function updateTimer() {

    $("timer").textContent = time;

    $("bar").style.width = (time/30*100) + "%";

    const color = time <= 5
        ? "#ff3344"
        : time <= 10
        ? "#ffae00"
        : "#00eaff";

    $("timer").style.borderColor = color;
    $("bar").style.background = color;
}

function addPoints(map,name,points) {

    const key = normalize(name);

    const previous = map.get(key);

    map.set(key,{
        name:name,
        points:(previous?.points || 0)+points
    });
}

function receiveComment(name,message) {

    if (!active || Date.now() >= deadline) return;

    name = String(name).trim().slice(0,40);

    if (!name) return;

    const key = normalize(name);

    if (answered.has(key)) return;

    const answer = normalize(message);

    const correct = current[2].some(a =>
        normalize(a) === answer
    );

    if (!correct) return;

    answered.add(key);

    addPoints(quizScores,name,10);

    $("feedback").textContent =
        "🔥 " + name + " acertou! +10";

    effect("correct");

    if (
        "speechSynthesis" in window &&
        !speechSynthesis.speaking &&
        time > 5
    ) {
        speak("Boa, " + name + "! Você acertou!");
    }

    updateRankings();
}

function receiveGift(name,gift,value) {

    name = String(name).trim().slice(0,40);
    gift = String(gift).trim().slice(0,40);

    if (!name || !gift) return;

    const points = Math.max(
        1,Math.min(1000000,Math.floor(Number(value)||1))
    );

    addPoints(giftScores,name,points);

    $("giftAlert").textContent =
        "🎁 " + name + " enviou " + gift + "!";

    $("giftAlert").classList.add("show");

    clearTimeout(giftTimer);

    giftTimer = setTimeout(() => {
        $("giftAlert").classList.remove("show");
    },4000);

    effect("gift");

    speak(
        "Muito obrigado pelo presente, " +
        name + "! Valeu pelo apoio!"
    );

    updateRankings();
}

function endQuestion() {

    clearInterval(interval);

    active = false;

    const correct = current[2][0];

    $("feedback").textContent =
        "✅ RESPOSTA: " + correct;

    effect("correct");

    if (answered.size === 0) {

        speak(
            "Nossa! Ninguém acertou! A resposta correta é " +
            correct,true
        );

    } else {

        speak(
            "Tempo encerrado! A resposta correta é " +
            correct + "! Parabéns para quem acertou!",
            true
        );
    }

    setTimeout(nextQuestion,6500);
}

function renderRanking(map,id) {

    const sorted = [...map.values()]
        .sort((a,b)=>b.points-a.points)
        .slice(0,5);

    if (!sorted.length) return;

    const element = $(id);

    element.className = "";
    element.replaceChildren();

    const medals = ["🥇","🥈","🥉","4º","5º"];

    sorted.forEach((player,index)=>{

        const row = document.createElement("div");

        row.className = "player";

        const name = document.createElement("span");

        name.textContent =
            medals[index] + " " + player.name;

        const points = document.createElement("strong");

        points.textContent = player.points;

        row.append(name,points);

        element.appendChild(row);
    });
}

function updateRankings() {

    renderRanking(quizScores,"quizRanking");

    renderRanking(giftScores,"giftRanking");
}

function simulateAnswer() {

    receiveComment(
        $("testName").value,
        $("testAnswer").value
    );

    $("testAnswer").value = "";
}

function simulateGift() {

    receiveGift(
        $("testName").value,
        $("testGift").value,
        $("testValue").value
    );
}

document.addEventListener("keydown",event=>{

    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase()==="p"
    ) {

        event.preventDefault();

        const panel = $("testPanel");

        panel.style.display =
            panel.style.display==="block"
            ? "none"
            : "block";
    }
});

if (
    new URLSearchParams(location.search)
        .get("teste")==="1"
) {
    $("testPanel").style.display = "block";
}

</script>
<script>
let melhorVoz;
let filaDeFalas = [];
let falando = false;

function carregarVoz() {
    const vozes = speechSynthesis.getVoices();

    melhorVoz = vozes.find(v =>
        /Antonio.*Natural/i.test(v.name)
    ) || vozes.find(v =>
        /Antonio|Antônio|Daniel|Felipe/i.test(v.name) &&
        v.lang === "pt-BR"
    ) || vozes.find(v =>
        v.lang === "pt-BR"
    );
}

carregarVoz();

speechSynthesis.onvoiceschanged = carregarVoz;

speak = function(texto, urgente = false) {

    if (urgente) {
        filaDeFalas.unshift(texto);
    } else {
        filaDeFalas.push(texto);
    }

    reproduzirFala();
};

function reproduzirFala() {

    if (falando || !filaDeFalas.length) return;

    falando = true;

    const texto = filaDeFalas.shift();
    const fala = new SpeechSynthesisUtterance(texto);

    fala.lang = "pt-BR";
    fala.rate = 1.12 + Math.random() * 0.06;
    fala.pitch = 0.95 + Math.random() * 0.10;
    fala.volume = 1;

    if (melhorVoz) {
        fala.voice = melhorVoz;
    }

    if (musicGain) {
        musicGain.gain.value = 0.015;
    }

    fala.onend = fala.onerror = function() {

        falando = false;

        if (musicGain) {
            musicGain.gain.value = 0.065;
        }

        reproduzirFala();
    };

    speechSynthesis.speak(fala);
}

const comentariosApresentador = [
    "Bora, galera! Quero ver quem sabe!",
    "Essa eu quero ver!",
    "Será que alguém vai acertar?",
    "Pensa rápido, hein!",
    "Tá fácil essa!",
    "Quero ver quem manda bem!",
    "Ainda dá tempo!",
    "Capricha na resposta!",
    "Vamos lá, pessoal!",
    "Quem sabe essa?"
];

let ultimoComentario = "";

setInterval(() => {

    if (!active || falando || filaDeFalas.length) return;

    if (time <= 6 || time >= 25) return;

    let frase;

    do {
        frase = comentariosApresentador[
            Math.floor(
                Math.random() *
                comentariosApresentador.length
            )
        ];
    } while (frase === ultimoComentario);

    ultimoComentario = frase;

    speak(frase);

}, 8500);
</script>
<script>

// CORREÇÃO DA SINCRONIZAÇÃO

let narrandoRodada = false;

function narrarSincronizado(texto) {

    return new Promise(resolve => {

        speechSynthesis.cancel();

        filaDeFalas.length = 0;
        falando = false;

        const fala = new SpeechSynthesisUtterance(texto);

        fala.lang = "pt-BR";
        fala.rate = 1.15;
        fala.pitch = 1.02;
        fala.volume = 1;

        if (melhorVoz) {
            fala.voice = melhorVoz;
        }

        narrandoRodada = true;
        falando = true;

        if (musicGain) {
            musicGain.gain.value = 0.015;
        }

        fala.onend = fala.onerror = () => {

            narrandoRodada = false;
            falando = false;

            if (musicGain) {
                musicGain.gain.value = 0.065;
            }

            resolve();
        };

        speechSynthesis.speak(fala);

    });
}

nextQuestion = async function() {

    clearInterval(interval);

    active = false;

    filaDeFalas.length = 0;

    if (!deck.length) refillDeck();

    current = deck.pop();

    lastQuestion = current[1];

    round++;

    answered.clear();

    time = 30;

    $("round").textContent = "RODADA " + round;
    $("category").textContent = current[0];
    $("question").textContent = current[1];
    $("feedback").textContent = "";

    updateTimer();

    const chamadas = [
        "Bora pra próxima!",
        "Atenção, galera!",
        "Quero ver quem sabe essa!",
        "Preparados? Lá vai!",
        "Mais um desafio!"
    ];

    const chamada = chamadas[
        Math.floor(Math.random() * chamadas.length)
    ];

    await narrarSincronizado(
        chamada + " " + current[1]
    );

    active = true;

    deadline = Date.now() + 30000;

    interval = setInterval(() => {

        const restante = Math.max(
            0,
            Math.ceil((deadline - Date.now()) / 1000)
        );

        if (restante === time) return;

        time = restante;

        updateTimer();

        if (time === 5 && !falando) {
            speak("Tá acabando o tempo!");
        }

        if (time > 0 && time <= 5) {
            effect("tick");
        }

        if (time === 0) {
            endQuestion();
        }

    }, 100);
};

endQuestion = async function() {

    clearInterval(interval);

    active = false;

    const resposta = current[2][0];

    $("feedback").textContent =
        "✅ RESPOSTA: " + resposta;

    effect("correct");

    let frase;

    if (answered.size === 0) {

        frase =
            "Essa foi difícil, hein! A resposta correta é " +
            resposta + "!";

    } else {

        frase =
            "Acabou o tempo! A resposta é " +
            resposta +
            "! Parabéns pra quem acertou!";
    }

    await narrarSincronizado(frase);

    setTimeout(nextQuestion, 2000);
};

</script>
    
</body>
